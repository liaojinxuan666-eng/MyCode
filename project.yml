name: MyCode
options:
  bundleIdPrefix: com.liaojinxuan666
  deploymentTarget:
    iOS: "15.0"
targets:
  MyCode:
    type: application
    platform: iOS
    sources: 
      - src  # 注意这里改成了 src 目录
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"
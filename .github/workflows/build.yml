name: Build MyCode IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 允许手动点击按钮触发

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build with xcodebuild
        run: |
          xcodebuild -project MyCode.xcodeproj \
                     -scheme MyCode \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/MyCode.app Payload/
          zip -r MyCode.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyCode-IPA
          path: MyCode.ipa